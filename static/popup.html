<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Colonist Ally</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!--
    THESIS: A compact instrument controls the live assistant without becoming a miniature dashboard.
    OWN-WORLD: Matte midnight field, mineral-white type, sulfur signals, ruled settings, and tabular status data.
    STORY: Confirm the assistant is live, then return to the board.
    FIRST VIEWPORT: Product identity, one live readout, one switch, and two plain actions.
    FORM: The table-side scorebug reduced to its essential toolbar controls.
    -->
    <header class="topbar">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2.8 27.4 9.4v13.2L16 29.2 4.6 22.6V9.4L16 2.8Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M10 20 16 9l6 11M12.25 16h7.5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="square"/>
        <circle cx="13.75" cy="7" r="1.6" fill="currentColor"/>
        <circle cx="18.25" cy="7" r="1.6" fill="currentColor"/>
      </svg>
      <div>
        <h1>Colonist Ally</h1>
        <p>Public evidence · explainable advice</p>
      </div>
    </header>

    <main>
      <section id="status" class="status" aria-live="polite">
        <strong>Waiting for a game</strong>
        <span>Open Colonist and start a friendly match.</span>
      </section>

      <section class="settings" aria-label="Assistant settings">
        <div class="section-label">ASSISTANT</div>
        <label>
          <span><b>Show on Colonist</b><small>Display your live advice and board marker</small></span>
          <input type="checkbox" data-setting="enabled" />
          <i></i>
        </label>
        <label>
          <span><b>Highlight next click</b><small>Circle the recommended Colonist control or card</small></span>
          <input type="checkbox" data-setting="highlightNextAction" />
          <i></i>
        </label>
        <label>
          <span><b>Disable player trades</b><small>Only bank and port trades are allowed</small></span>
          <input type="checkbox" data-setting="disablePlayerTrades" />
          <i></i>
        </label>
        <label>
          <span><b>Record game</b><small>Keep compact LLM-ready events, board deltas, belief evidence, reasoning, timing, and execution results</small></span>
          <input type="checkbox" data-setting="recordGame" />
          <i></i>
        </label>
        <label>
          <span><b>Autopilot</b><small>Play recommended steps automatically in any Colonist game</small></span>
          <input type="checkbox" data-setting="autonomousPrivateGames" />
          <i></i>
        </label>
        <label class="delay-row">
          <span><b>Autopilot delay</b><small>Wait before each automatic click</small></span>
          <select data-setting="autopilotDelaySeconds" aria-label="Autopilot delay">
            <option value="0">None</option>
            <option value="1">1 second</option>
            <option value="3">3 seconds</option>
            <option value="5">5 seconds</option>
          </select>
        </label>
      </section>

      <div class="actions">
        <a href="https://colonist.io/" target="_blank" rel="noreferrer">Open Colonist ↗</a>
        <button id="export-record">Export compact LLM record</button>
        <button id="reset">Reset session</button>
      </div>
    </main>

    <footer>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 2.8 8.1 7 10 4.2-1.9 7-5.5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
      <span>
        Reads game data shown on Colonist. Game data stays in this browser.
        <a href="https://rgo.pt/privacy/colonist-assistant" target="_blank" rel="noreferrer">Privacy</a>
      </span>
      <b id="version" aria-label="Installed extension version"></b>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
