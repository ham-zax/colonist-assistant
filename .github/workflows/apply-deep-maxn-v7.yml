name: Apply Deep MaxN v7
on:
  pull_request:
    branches: [cursor/strategist-architecture-upgrade-7f99]
permissions:
  contents: read
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,wasm-bindgen-cli@0.2.126
      - run: python scripts/apply-deep-maxn-v7-bootstrap.py
      - run: python scripts/apply-deep-maxn-v7-fix2.py
      - run: python scripts/apply-deep-maxn-v7-fix3.py
      - run: python scripts/apply-deep-maxn-v7-fix4.py
      - run: python scripts/apply-deep-maxn-v7-fix5.py
      - run: rm -f scripts/apply-deep-maxn-v7-bootstrap.py scripts/apply-deep-maxn-v7-fix2.py scripts/apply-deep-maxn-v7-fix3.py scripts/apply-deep-maxn-v7-fix4.py scripts/apply-deep-maxn-v7-fix5.py .github/workflows/apply-deep-maxn-v7.yml
      - run: cargo fmt --manifest-path engine/Cargo.toml --all
      - run: npm ci
      - run: npm run check
      - run: npm run verify:rust
      - run: npm run build:wasm
      - run: npm test
      - run: npm run build
      - name: Collect verified changes
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, subprocess
          out = Path('/tmp/deep-maxn-v7')
          files = out / 'files'
          files.mkdir(parents=True, exist_ok=True)
          raw = subprocess.check_output(['git', 'status', '--porcelain=v1', '-z'])
          entries = raw.decode().split('\0')
          deleted = []
          for entry in filter(None, entries):
              status, path = entry[:2], entry[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if 'D' in status:
                  deleted.append(path)
                  continue
              source = Path(path)
              if source.is_file():
                  target = files / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
          (out / 'deleted.txt').write_text('\n'.join(deleted) + ('\n' if deleted else ''))
          (out / 'status.txt').write_bytes(raw.replace(b'\0', b'\n'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-maxn-v7-changes
          path: /tmp/deep-maxn-v7
          if-no-files-found: error
