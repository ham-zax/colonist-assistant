name: Finalize v7 coreset

on:
  push:
    branches: [agent/deep-maxn-v7]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-maxn-v7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.126
      - run: python scripts/fix-v7-coreset.py
      - run: rm scripts/fix-v7-coreset.py
      - run: cargo fmt --manifest-path engine/Cargo.toml --all
      - run: npm ci
      - run: npm run check
      - run: npm run verify:rust
      - run: npm run build:wasm
      - run: npm test
      - run: npm run build
      - name: Commit verified correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git restore --source=HEAD -- .github/workflows/finalize-v7-coreset.yml
          git add -A
          git commit -m "finalize strategic particle coreset"
          git push origin HEAD:agent/deep-maxn-v7
