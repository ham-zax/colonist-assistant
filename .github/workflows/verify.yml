name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.126
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run verify:rust
      - run: bun run build:wasm
      - name: Verify generated WASM is committed
        run: git diff --exit-code -- src/generated/wasm
      - run: bun run test
      - run: bun run build
