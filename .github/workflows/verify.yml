name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.126
      - run: npm ci
      - run: npm run check
      - run: npm run verify:rust
      - run: npm run build:wasm
      - name: Verify generated WASM is committed
        run: git diff --exit-code -- src/generated/wasm
      - run: npm test
      - run: npm run build
