[package]
name = "colonist-catan-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
native-benchmark = ["dep:serde_json"]
parallel = ["colonist-catan-search/parallel"]
wasm-threads = ["colonist-catan-search/parallel", "dep:wasm-bindgen-rayon"]
native-gpu = [
  "colonist-catan-search/cuda-sim",
  "colonist-catan-search/cuda-exact",
  "dep:serde_json",
]

[dependencies]
colonist-catan-core = { path = "../catan-core" }
colonist-catan-search = { path = "../catan-search" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { version = "1.3", optional = true, features = ["no-bundler"] }

[dev-dependencies]
serde_json = "1.0"

[[example]]
name = "threading_benchmark"
required-features = ["native-benchmark"]
