[package]
name = "colonist-catan-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
native-gpu = ["colonist-catan-search/cuda-sim", "dep:serde_json"]

[dependencies]
colonist-catan-core = { path = "../catan-core" }
colonist-catan-search = { path = "../catan-search" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = "1.0"
