[package]
name = "colonist-catan-native-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "colonist-assistant-gpu"
path = "src/main.rs"

[dependencies]
colonist-catan-wasm = { path = "../catan-wasm", features = ["native-gpu"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
