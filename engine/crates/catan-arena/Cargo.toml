[package]
name = "colonist-catan-arena"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "colonist-arena"
path = "src/main.rs"

[[bin]]
name = "exact-gpu-parity"
path = "src/bin/exact-gpu-parity.rs"
required-features = ["cuda-exact"]

[[bin]]
name = "exact-gpu-search-parity"
path = "src/bin/exact-gpu-search-parity.rs"
required-features = ["cuda-exact"]

[[bin]]
name = "gpu-sim-campaign"
path = "src/bin/gpu-sim-campaign.rs"
required-features = ["cuda-sim"]

[[bin]]
name = "gpu-sim-agent-benchmark"
path = "src/bin/gpu-sim-agent-benchmark.rs"
required-features = ["cuda-sim"]

[features]
cuda-exact = ["colonist-catan-search/cuda-exact"]
cuda-sim = ["colonist-catan-search/cuda-sim"]

[dependencies]
colonist-catan-core = { path = "../catan-core" }
colonist-catan-search = { path = "../catan-search", features = ["benchmark-profile"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
