[package]
name = "colonist-catan-arena"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "colonist-arena"
path = "src/main.rs"

[[bin]]
name = "exact-gpu-parity"
path = "src/bin/exact-gpu-parity.rs"
required-features = ["cuda-exact"]

[features]
cuda-exact = ["colonist-catan-search/cuda-exact"]

[dependencies]
colonist-catan-core = { path = "../catan-core" }
colonist-catan-search = { path = "../catan-search", features = ["benchmark-profile"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
